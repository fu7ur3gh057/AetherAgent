---
# ./deploy.sh setup   — первый раз: папка, git clone, загрузка .env
# ./deploy.sh env     — перезалить .env на сервер и перезапустить
# ./deploy.sh         — git pull + пересборка + ожидание healthcheck
- name: Deploy Aether
  hosts: prod
  gather_facts: false
  vars:
    aether_root: /opt/aether
    # host-алиас github-aether описан в ~/.ssh/config на сервере (см. ниже)
    repo_url: "git@github-aether:fu7ur3gh057/AetherAgent.git"
    deploy_key: ~/.ssh/aether_deploy
    branch: main
    compose_file: "{{ aether_root }}/docker-compose.yml"

  tasks:
    - name: Setup | проверить, что deploy key существует на сервере
      ansible.builtin.stat:
        path: "{{ deploy_key }}"
      register: key
      tags: [setup]

    - name: Setup | остановиться, если ключа нет
      ansible.builtin.assert:
        that: key.stat.exists
        fail_msg: "На сервере нет {{ deploy_key }}. Создай ключ и добавь .pub в GitHub Deploy keys."
      tags: [setup]

    - name: Setup | ssh-алиас github-aether (только для этого репо, не трогает Glent)
      ansible.builtin.blockinfile:
        path: ~/.ssh/config
        create: true
        mode: "0600"
        marker: "# {mark} aether"
        block: |
          Host github-aether
            HostName github.com
            User git
            IdentityFile {{ deploy_key }}
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
      tags: [setup]

    - name: Setup | создать /opt/aether
      ansible.builtin.file:
        path: "{{ aether_root }}"
        state: directory
        mode: "0750"
      tags: [setup]

    - name: Setup | git clone (если ещё нет)
      ansible.builtin.command:
        cmd: git clone -b {{ branch }} {{ repo_url }} {{ aether_root }}
        creates: "{{ aether_root }}/.git"
      tags: [setup]

    - name: Env | загрузить .env с мака (права 600)
      ansible.builtin.copy:
        src: ../.env
        dest: "{{ aether_root }}/.env"
        mode: "0600"
      tags: [setup, env]

    - name: Gmail | папка data на сервере
      ansible.builtin.file:
        path: "{{ aether_root }}/data"
        state: directory
        mode: "0700"
      tags: [setup, gmail]

    - name: Gmail | загрузить google_token.json с мака (права 600)
      ansible.builtin.copy:
        src: ../data/google_token.json
        dest: "{{ aether_root }}/data/google_token.json"
        mode: "0600"
      tags: [gmail]

    - name: Gmail | перезапустить бота, чтобы подхватил токен
      ansible.builtin.command: docker compose -f {{ compose_file }} up -d --build bot
      tags: [gmail]

    - name: Env | перезапустить после смены .env
      ansible.builtin.command: docker compose -f {{ compose_file }} up -d --build
      tags: [env]

    - name: Deploy | git pull
      ansible.builtin.command: git -C {{ aether_root }} pull origin {{ branch }}
      register: pull
      changed_when: "'Already up to date' not in pull.stdout"
      tags: [deploy]

    - name: Deploy | пересобрать и перезапустить
      ansible.builtin.command: docker compose -f {{ compose_file }} up -d --build
      tags: [deploy, setup]

    - name: Deploy | ждать healthcheck бота (миграции идут при старте)
      ansible.builtin.command: docker inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }}' aether_bot
      register: health
      until: health.stdout | trim == 'healthy'
      retries: 30
      delay: 5
      changed_when: false
      tags: [deploy, setup, env, gmail]

    - name: Что выкачено
      ansible.builtin.shell: |
        git -C {{ aether_root }} log -1 --format='aether: %h %s'
        docker compose -f {{ compose_file }} ps --format 'table {{ '{{' }}.Name{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}'
      register: summary
      changed_when: false
      tags: [deploy, setup, env, gmail]

    - ansible.builtin.debug:
        msg: "{{ summary.stdout_lines }}"
      tags: [deploy, setup, env, gmail]
